name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -q

      - name: Smoke test full pipeline (offline fixture run)
        # DEVELOPMENT_RULES.md 9절: 병합 전 "전체 파이프라인 1회 실행 성공"을 CI에서 강제한다.
        # CI에는 API 키·모델 설정·RAG runtime 의존성이 없으므로, LLM/웹/RAG 호출 없이
        # 고정 fixture로 그래프 전체 흐름을 실행하는 --smoke-fixture 모드를 사용한다.
        run: python app.py --smoke-fixture --thread-id ci-smoke

      - name: Check final_report was produced
        run: test -f outputs/smoke/final_report.md
