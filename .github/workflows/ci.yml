name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -q

      - name: Smoke test full pipeline (no API keys)
        # DEVELOPMENT_RULES.md 9절: 병합 전 "전체 파이프라인 1회 실행 성공"을 CI에서 강제한다.
        # CI에는 API 키가 없어 검색이 모두 실패하므로 judge가 근거 부족으로 record_failure에 보낸다.
        # 예외 없이 START부터 END까지 도는지만 확인한다.
        run: python app.py --thread-id ci-smoke

      - name: Check pipeline produced an outcome
        # 정상 종료는 final_report.md 또는 validation_failure.json 중 하나를 남긴다.
        # 설계서 4장 '라우팅과 최종 종료'·6장: 상한 후 차단 이슈가 남으면 보고서 없이 실패 기록만 저장한다.
        run: test -f outputs/final_report.md || test -f outputs/validation_failure.json
